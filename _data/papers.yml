- slug: ai-passenger-inspection-ngurah-rai
  status: working_paper
  title: "AI-Assisted Passenger Goods Inspection at Ngurah Rai International Airport - A Simplified Design Science Research Study"   # as on Zenodo v2
  coauthors: [Kurniawan Setiyadi]
  year: 2025
  revised:
  summary: Design science study of an AI-enabled Telegram bot that automates customs inspection documentation with speech-to-text and rule-based classification. Interviews with 25 customs officers and three expert stakeholders found a 93% reduction in documentation time, alongside trust and accountability concerns.
  links:
